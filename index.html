<script>"use strict";const P=["GS","GA","WA","C","WD","GD","GK"],S={GS:[50,9],GA:[50,23],WA:[25,40],C:[50,50],WD:[75,60],GD:[50,77],GK:[50,91]};let d={players:[],q:{Q1:{},Q2:{},Q3:{},Q4:{}}},q="Q1",sel=null;const $=x=>document.getElementById(x),court=$("court");function uid(){return Date.now()+Math.random().toString(36)}function safe(v){return String(v??"").replace(/[<>]/g,"").trim().slice(0,50)}function draw(){players();quarters();courtDraw();bench()}function players(){let h=$("players");h.innerHTML="";d.players.forEach(p=>{let r=document.createElement("div");r.className="person";let a=document.createElement("span");a.className="badge";a.textContent=p.pos;let n=document.createElement("span");n.textContent=p.name;let e=document.createElement("button");e.textContent="Edit";e.onclick=()=>open(p.id);let x=document.createElement("button");x.textContent="×";x.onclick=()=>{if(confirm("Remove "+p.name+"?")){d.players=d.players.filter(z=>z.id!==p.id);Object.values(d.q).forEach(z=>delete z[p.id]);draw()}};r.append(a,n,e,x);h.append(r)})}function quarters(){let h=$("qs");h.innerHTML="";Object.keys(d.q).forEach(x=>{let b=document.createElement("button");b.textContent=x;b.className=x===q?"active":"";b.onclick=()=>{q=x;sel=null;draw()};h.append(b)})}function courtDraw(){court.querySelectorAll(".token").forEach(x=>x.remove());Object.entries(d.q[q]).forEach(([id,l])=>{let p=d.players.find(x=>x.id===id);if(!p)return;let t=document.createElement("div");t.className="token"+(id===sel?" selected":"");t.style.left=l.x+"%";t.style.top=l.y+"%";let b=document.createElement("b");b.textContent=l.pos;let n=document.createElement("span");n.textContent=p.name;t.append(b,n);interactive(t,id);court.append(t)})}function bench(){let h=$("bench");h.innerHTML="";d.players.filter(p=>!d.q[q][p.id]).forEach(p=>{let x=document.createElement("div");x.className="benchitem";x.textContent=p.pos+"  "+p.name;x.onclick=()=>place(p.id);h.append(x)})}function place(id){let p=d.players.find(x=>x.id===id),used=Object.values(d.q[q]),pos=p.pos;if(used.length>=7)return alert("Seven players are already on court.");if(pos==="SUB"||used.some(x=>x.pos===pos))pos=P.find(x=>!used.some(y=>y.pos===x));if(!pos)return;d.q[q][id]={pos,x:S[pos][0],y:S[pos][1]};sel=id;draw()}function interactive(el,id){let sx=0,sy=0,moved=false,last=0;el.onpointerdown=e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId);el.onpointermove=m=>{if(Math.hypot(m.clientX-sx,m.clientY-sy)>6)moved=true;let r=court.getBoundingClientRect(),x=(m.clientX-r.left)/r.width*100,y=(m.clientY-r.top)/r.height*100;x=Math.max(8,Math.min(92,x));y=Math.max(4,Math.min(96,y));Object.assign(d.q[q][id],{x,y});el.style.left=x+"%";el.style.top=y+"%"};el.onpointerup=()=>{el.onpointermove=null;sel=id;if(moved){draw();return}let now=Date.now();if(now-last<420){last=0;open(id)}else{last=now;draw()}}};el.ondblclick=e=>{e.preventDefault();open(id)}}function open(id){let p=d.players.find(x=>x.id===id);if(!p)return;sel=id;$("editName").value=p.name;$("editPos").value=p.pos;$("modal").classList.add("show")}$("add").onclick=()=>{let n=safe($("name").value);if(!n)return;d.players.push({id:uid(),name:n,pos:$("pos").value});$("name").value="";draw()};$("cancel").onclick=()=>$("modal").classList.remove("show");$("save").onclick=()=>{let p=d.players.find(x=>x.id===sel);if(!p)return;p.name=safe($("editName").value)||p.name;p.pos=$("editPos").value;$("modal").classList.remove("show");draw()};$("benchBtn").onclick=()=>{if(sel&&d.q[q][sel])delete d.q[q][sel];$("modal").classList.remove("show");sel=null;draw()};$("copy").onclick=()=>{let a=Object.keys(d.q),i=a.indexOf(q);if(i>0)d.q[q]=JSON.parse(JSON.stringify(d.q[a[i-1]]));draw()};$("clear").onclick=()=>{d.q[q]={};sel=null;draw()};$("download").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.href=u;a.download="Glengowrie_U15_team.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};$("load").onchange=e=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.players)||!x.q)throw 0;d=x;q="Q1";sel=null;draw()}catch{alert("Invalid team file")}};if(e.target.files[0])r.readAsText(e.target.files[0])};draw();</script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script></body></html>
